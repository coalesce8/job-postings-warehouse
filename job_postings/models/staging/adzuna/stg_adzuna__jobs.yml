version: 2

models:
  - name: stg_adzuna__jobs
    description: One row per job posting returned by the Adzuna search API, with location fields parsed out and surrogate/natural keys added.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pull_id
              - job_id
    columns:
      - name: salary_min
        data_type: double
        description: Minimum salary advertised for the position.

      - name: salary_max
        data_type: double
        description: Maximum salary advertised for the position.

      - name: company_name
        data_type: varchar
        description: Name of the hiring company, trimmed and nulled if blank.

      - name: granularity_level
        data_type: integer
        description: Count of non-null location fields (area_level_2 through area_level_4, plus country_name which is always present) available for this job, from 1 to 4.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

      - name: lowest_level_name
        data_type: varchar
        description: The most specific non-null location value available, preferring area_level_4, then area_level_3, then area_level_2, then country_name.

      - name: posted_at_utc
        data_type: timestamp
        description: >
          Timestamp the job was posted, in UTC. Derived from posted_at_local
          using market_timezone. This is the canonical posting time; all
          downstream dates come from it.
        data_tests:
          - not_null

      - name: posted_at_local
        data_type: timestamp
        description: >
          Timestamp the job was posted as wall-clock time in the market's own
          timezone, exactly as Adzuna sent it (its `created` carries a "Z"
          suffix but is local time, not UTC). Kept for time-of-day analysis;
          use posted_at_utc for anything else.
        data_tests:
          - not_null

      - name: market_timezone
        data_type: varchar
        description: IANA timezone of the market (from the country_codes seed), used to convert posted_at_local to posted_at_utc.
        data_tests:
          - not_null
        data_tests:
          - not_null

      - name: location_key
        data_type: varchar
        description: Surrogate key generated from country_name, area_level_2, area_level_3, and area_level_4.
        data_tests:
          - not_null

      - name: country_code
        data_type: varchar
        description: Two-letter code of the country-specific Adzuna API endpoint that returned this job.
        data_tests:
          - not_null

      - name: currency
        data_type: varchar
        description: "Currency of the advertised salary, looked up from the country_codes seed by country_code. Null (and failing not_null) if the country is missing from the seed."
        data_tests:
          - not_null

      - name: fetched_at
        data_type: timestamp
        description: Timestamp (UTC, naive) the pull was fetched from the Adzuna API, as recorded by ingest.py.
        data_tests:
          - not_null

      - name: pull_id
        data_type: varchar
        description: Identifier for the API pull (one per country per run) this job was returned in. Part of the composite primary key.
        data_tests:
          - not_null

      - name: job_id
        data_type: varchar
        description: Adzuna's unique identifier for the job posting. Part of the composite primary key (pull_id, job_id) - the same job can reappear across pulls.
        data_tests:
          - not_null

      - name: job_title
        data_type: varchar
        description: Job title as posted, trimmed and nulled if blank.

      - name: company_key
        data_type: varchar
        description: Lower-cased company_name to account for variation in capitalization; "__UNKNOWN__" when company_name is null.
        data_tests:
          - not_null

      - name: location_display
        data_type: varchar
        description: Human-readable location string, e.g. "London, South East England".

      - name: country_name
        data_type: varchar
        description: Broadest level of the source location breakdown (position 1 of 4), i.e. the country name as Adzuna spells it (e.g. "UK", "Italia"). Not coalesced; the not_null test guards against Adzuna returning an empty location breakdown.
        data_tests:
          - not_null

      - name: area_level_2
        data_type: varchar
        description: Second level of the source location breakdown (position 2 of 4; what this represents can vary by country), or "__UNKNOWN__" when not available.
        data_tests:
          - not_null

      - name: area_level_3
        data_type: varchar
        description: Third level of the source location breakdown (position 3 of 4; what this represents can vary by country), or "__UNKNOWN__" when not available.
        data_tests:
          - not_null

      - name: area_level_4
        data_type: varchar
        description: Most granular level of the source location breakdown (position 4 of 4; what this represents can vary by country), or "__UNKNOWN__" when not available.
        data_tests:
          - not_null

      - name: category_tag
        data_type: varchar
        description: Adzuna's internal slug for the job category. Always present; note "unknown" is a real Adzuna category, not a missing value.
        data_tests:
          - not_null

      - name: category_label
        data_type: varchar
        description: Human-readable label for the job category.

      - name: is_salary_predicted
        data_type: boolean
        description: Whether the salary was predicted by Adzuna rather than stated in the posting.
        data_tests:
          - not_null

      - name: contract_time
        data_type: varchar
        description: Full-time or part-time.
        data_tests:
          - accepted_values:
              arguments:
                values: ["full_time", "part_time"]

      - name: contract_type
        data_type: varchar
        description: Permanent or contract.
        data_tests:
          - accepted_values:
              arguments:
                values: ["permanent", "contract"]

      - name: job_description
        data_type: varchar
        description: Snippet of the job description text.

      - name: redirect_url
        data_type: varchar
        description: URL to the job listing on Adzuna.

