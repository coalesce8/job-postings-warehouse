version: 2

models:
  - name: dim_category
    description: >
      One row per distinct Adzuna category observed across job postings,
      with the raw category slug classified into a broader tag_type grouping.
    columns:
      - name: category_key
        data_type: varchar
        description: "Adzuna's category slug. Primary key."
        data_tests:
          - unique
          - not_null

      - name: category_label
        data_type: varchar
        description: "Human-readable label for the category. The UK (English) label where the tag has been seen in UK pulls, otherwise whichever localised label was observed."

      - name: tag_type
        data_type: varchar
        description: >
          Grouping of category_key into a broader category, such as
          Occupation, Employer type, Contract type, Career stage, or
          Residual (for tags that don't fit another group).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Career stage", "Contract type", "Employer type", "Occupation", "Residual"]